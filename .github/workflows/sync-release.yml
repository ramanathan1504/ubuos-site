# Keep the site truthful about what has been released.
#
# Documentation goes stale in one specific way: a version is published, and the
# page still describes the one before it. Nobody notices, because the page still
# looks right — it is only wrong.
#
# So the changelog page and the version shown on the site are GENERATED from the
# published releases of oss rather than written here. `oss` is public, so its
# releases are readable with no authentication, and this writes to its own
# repository with the automatic GITHUB_TOKEN. No cross-repo credential exists to
# expire — the lesson from the Homebrew tap, which shipped two releases pointing
# at the previous version after its token lapsed.
name: Sync release

on:
  # Polled rather than pushed: a push from the other repository would need a
  # credential, which is the thing being avoided.
  # Daily rather than every six hours. This poll exists because the landing page
  # folded in below lives in another repository and a push from there would need
  # a cross-repo credential -- the kind that expired once and shipped a stale
  # formula in the tap without anyone noticing.
  #
  # oss-cli's release.sh now starts this workflow itself the moment it has
  # tagged, from the shell of the person releasing, who is already authenticated.
  # Nothing is stored here and nothing expires, and the site is current within a
  # minute of a release rather than within six hours -- so this is the safety net
  # for a release cut some other way, and a safety net does not need four runs a
  # day to catch something that happens twice a week.
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  # Creating the pull request needs its own scope. Without it the branch pushes
  # successfully and only `gh pr create` fails -- "Resource not accessible by
  # integration" -- which reads like a token problem rather than a missing
  # permission, because the push right before it worked.
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Read the published releases
        id: rel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY_OWNER}/oss-cli"
          # Newest first, and only what is actually published -- drafts and
          # pre-releases are excluded, because the site should describe what a
          # reader can install right now.
          gh api "repos/$repo/releases" --paginate \
            --jq '[.[] | select(.draft==false and .prerelease==false)
                       | {tag: .tag_name, name: .name, body: .body, at: .published_at}]' \
            > releases.json
          latest=$(jq -r '.[0].tag // empty' releases.json)
          [ -n "$latest" ] || { echo "no published release found"; exit 1; }
          echo "latest=${latest#v}" >> "$GITHUB_OUTPUT"
          echo "latest release: $latest"

      - name: Regenerate the changelog page
        run: |
          set -euo pipefail
          out=docs/src/content/docs/reference/changelog.md
          {
            echo '---'
            echo 'title: Changelog'
            echo 'description: What changed in each release, and why.'
            echo '---'
            echo
            echo '<!-- Generated by the Sync release workflow from published releases.'
            echo '     Hand edits are overwritten. Write release notes on the release. -->'
            echo
            echo "Current release: **${{ steps.rel.outputs.latest }}**."
            echo
            # The release body already opens with its own _YYYY-MM-DD_ line, because
            # that is how release.sh writes notes. Prepending another one printed the
            # date twice with an empty block between, on every entry since 1.11.4.
            #
            # Stripped from the body rather than dropped from the heading: the heading
            # date is publishedAt, which is a fact about the release, while the body is
            # whatever a human wrote and may not carry a date at all. The leading \s* is
            # not optional -- the bodies begin with a newline, so anchoring at ^_ matched
            # nothing and the first attempt at this fix silently changed no output.
            jq -r '.[] | "## " + (.tag | ltrimstr("v")) + "\n\n_" + (.at | split("T")[0]) + "_\n\n"
                        + ((.body // "")
                           | gsub("\r"; "")
                           | sub("^\\s*_[0-9]{4}-[0-9]{2}-[0-9]{2}_\\s+"; "")
                           | sub("\\s+$"; "")) + "\n"' releases.json
          } > "$out"
          rm -f releases.json
          echo "$(grep -c '^## ' "$out") release(s) written"

      - name: Open a pull request, if something actually changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # A scheduled job that commits every run fills the history with noise and
          # makes a real change impossible to spot.
          if git diff --quiet; then
            echo "already current"
            exit 0
          fi

          # A pull request rather than a push, because main is protected and takes
          # no direct pushes -- including from this bot. Pushing would have failed
          # every time, and a scheduled job that always fails is one nobody reads.
          branch="docs/changelog-${{ steps.rel.outputs.latest }}"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q -B "$branch"
          git commit -aqm "docs: sync changelog to ${{ steps.rel.outputs.latest }}"
          git push -q -f origin "$branch"

          # --state open, because `gh pr view <branch>` matches a MERGED pull request
          # as readily as an open one. The branch name is derived from the version, so
          # a re-run after that version's pull request was merged pushed the new
          # content, found the merged one, announced "already open" and opened nothing
          # -- leaving a corrected changelog on a branch nobody would look at while the
          # run reported success. Which is exactly what happened to 1.11.8.
          open_prs=$(gh pr list --head "$branch" --state open --json number --jq 'length')
          if [ "$open_prs" -gt 0 ]; then
            echo "pull request already open for $branch"
          else
            gh pr create --base main --head "$branch" \
              --title "docs: changelog for ${{ steps.rel.outputs.latest }}" \
              --body "Generated from the published releases of \`oss\` by the Sync release workflow. Release notes are written on the release, not here."
          fi

          # And merge it. A generated file that waits for a human to press a button is a
          # generated file that goes stale, and this one did: seven pull requests sat open
          # while the published page said "Current release: 1.11.15" for twelve releases and
          # five days. Every run reported success, because opening the pull request WAS the
          # success -- which is this repository's own rule about a warning that scrolls past
          # inside something that then prints success.
          #
          # Nothing is being bypassed. main is protected to require a pull request, and it
          # requires zero approving reviews and no status checks, so the only thing between
          # a correct generated file and the site was somebody noticing.
          #
          # --auto first so that the day a required check IS added, this waits for it instead
          # of merging red. With nothing to wait for, GitHub rejects --auto as "clean status"
          # rather than merging, which is what the fallback is for -- not error-swallowing,
          # the two cases are genuinely different commands.
          gh pr merge "$branch" --squash --delete-branch --auto \
            || gh pr merge "$branch" --squash --delete-branch

          # Deploy is NOT triggered by that merge, and this is the part that is easy to get
          # wrong twice. A push made with GITHUB_TOKEN does not start another workflow, so
          # deploy.yml's `on: push` will not see it -- the changelog would land on main and
          # the published site would keep serving the old one, which is the same bug one
          # layer down. Dispatching Deploy from here has the identical problem.
          #
          # So it is not attempted here. release.sh nudges Deploy from the releaser's own
          # shell AFTER waiting for this merge to land, and the daily schedule is the safety
          # net for a release cut some other way.
          echo "merged; Deploy is started by release.sh once this is on main"
