# Build both sites and publish each to its own Cloudflare Pages project.
#
# There are two sites in this repository and they are not the same thing:
#
#   site/  -> ubuos.com        the catalogue: what these tools are
#   docs/  -> docs.ubuos.com   the manual
#
# Deployed from here rather than by connecting Pages to Git, because a Pages Git
# integration reads its build settings from a dashboard -- so the command that
# builds this repository would live somewhere that is not this repository, and
# nobody reading the code could tell how it is published. Here it is reviewable,
# diffable, and changed in the same pull request as the thing it builds.
#
# The previous version of this workflow deployed the repository ROOT as a static
# site. That is why it had to be replaced rather than extended: the root is now
# source, not output, and publishing it would have served the Astro sources.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-ubuos
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      # Not fail-fast: if the catalogue breaks, the manual should still ship.
      # They are independent sites and one being broken is not a reason to
      # withhold the other.
      fail-fast: false
      matrix:
        include:
          - dir: site
            project: ubuos-site
          - dir: docs
            project: ubuos-docs

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22.12 is a hard floor, not a preference: package.json declares it and
          # Astro 7 will not run below it. Pinning here means a runner image
          # update cannot silently drop under the requirement.
          node-version: '22.12.0'

      - name: Install
        working-directory: ${{ matrix.dir }}
        # `npm ci` needs a lockfile; `npm install` is used because the lockfiles
        # are gitignored here. Deterministic enough for a static site, and it
        # cannot fail on a lockfile that does not exist.
        run: npm install --no-audit --no-fund

      - name: Build
        working-directory: ${{ matrix.dir }}
        run: npm run build

      - name: Check something was actually produced
        working-directory: ${{ matrix.dir }}
        # A build that succeeds and emits nothing would deploy an empty site over
        # a working one. Cheaper to catch here than to notice from a blank page.
        run: |
          test -f dist/index.html || { echo "no dist/index.html in ${{ matrix.dir }}"; exit 1; }
          echo "$(find dist -name '*.html' | wc -l) page(s) built"

      - name: Publish
        # Skipped rather than failed when the token is absent, so a fork's push
        # does not report a red build for a secret it was never going to have.
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        working-directory: ${{ matrix.dir }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@latest pages deploy dist \
            --project-name=${{ matrix.project }} \
            --branch=main \
            --commit-dirty=true

      - name: Say what to do if it was skipped
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          echo "Built ${{ matrix.dir }} but did not publish: CLOUDFLARE_API_TOKEN is not set."
          echo "Add these two repository secrets, then re-run:"
          echo "  CLOUDFLARE_API_TOKEN   — a token with Account → Cloudflare Pages → Edit"
          echo "  CLOUDFLARE_ACCOUNT_ID  — Cloudflare dashboard, right-hand sidebar"
