name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-ubuos-site
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The page is published exactly as written, so a malformed tag reaches
      # production unmodified. This is the only gate before it does.
      - name: Check the page is well-formed and self-contained
        run: |
          python3 - <<'PY'
          import sys
          from html.parser import HTMLParser

          VOID = {'area','base','br','col','embed','hr','img','input','link',
                  'meta','param','source','track','wbr'}
          # Elements that FETCH. An <a href> is a link the reader follows, not a
          # resource the page loads, and the catalogue links out on purpose.
          LOADING = {'link':'href','script':'src','img':'src','iframe':'src',
                     'source':'src','video':'src','audio':'src','embed':'src',
                     'object':'data','track':'src','input':'src'}

          class P(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.stack, self.errs, self.external = [], [], []
              def handle_starttag(self, t, attrs):
                  want = LOADING.get(t)
                  if want:
                      for k, v in attrs:
                          if k == want and v and v.startswith(('http://','https://','//')):
                              self.external.append((t, v, self.getpos()))
                  if t not in VOID:
                      self.stack.append((t, self.getpos()))
              def handle_startendtag(self, t, attrs):
                  self.handle_starttag(t, attrs)
                  if t not in VOID and self.stack:
                      self.stack.pop()
              def handle_endtag(self, t):
                  if not self.stack:
                      self.errs.append(f'stray </{t}> at {self.getpos()}'); return
                  top = self.stack.pop()
                  if top[0] != t:
                      self.errs.append(f'</{t}> at {self.getpos()} closes <{top[0]}> from {top[1]}')

          src = open('index.html', encoding='utf-8').read()
          p = P(); p.feed(src)

          fail = False
          for e in p.errs:
              print(f'::error file=index.html::{e}'); fail = True
          if p.stack:
              print(f'::error file=index.html::unclosed: {[t for t,_ in p.stack]}'); fail = True
          for tag, url, pos in p.external:
              print(f'::error file=index.html,line={pos[0]}::<{tag}> loads "{url}" from another '
                    f'host, which the policy in _headers blocks'); fail = True

          print('page FAILED' if fail else 'page OK')
          sys.exit(1 if fail else 0)
          PY

  deploy:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Skipped rather than failed when the credentials are absent, so a fork or
      # a contributor's pull request is not blocked on secrets they cannot hold.
      - name: Publish to Cloudflare Pages
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@latest pages deploy . --project-name=ubuos-site --branch=main

      - name: Say why nothing was published
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          echo "::warning::CLOUDFLARE_API_TOKEN is not set — the page was checked but not published."
