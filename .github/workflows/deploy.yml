# Build both sites and publish each to its own Cloudflare Pages project.
#
# There are two sites in this repository and they are not the same thing:
#
#   site/  -> ubuos.com        the catalogue: what these tools are
#   docs/  -> docs.ubuos.com   the manual
#
# Deployed from here rather than by connecting Pages to Git, because a Pages Git
# integration reads its build settings from a dashboard -- so the command that
# builds this repository would live somewhere that is not this repository, and
# nobody reading the code could tell how it is published. Here it is reviewable,
# diffable, and changed in the same pull request as the thing it builds.
#
# The previous version of this workflow deployed the repository ROOT as a static
# site. That is why it had to be replaced rather than extended: the root is now
# source, not output, and publishing it would have served the Astro sources.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-ubuos
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Job level, so the publish guard can see it. A step's own `env:` is not in
    # scope for that step's `if:`, which read as undefined -- and undefined != ''
    # is TRUE, so publishing once ran with no token at all.
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22.12 is a hard floor, not a preference: package.json declares it and
          # Astro 7 will not run below it. Pinning here means a runner image
          # update cannot silently drop under the requirement.
          node-version: '22.12.0'

      - name: Install
        working-directory: site
        # `npm ci` needs a lockfile; `npm install` is used because the lockfiles
        # are gitignored here. Deterministic enough for a static site, and it
        # cannot fail on a lockfile that does not exist.
        run: npm install --no-audit --no-fund

      - name: Build
        working-directory: site
        run: npm run build

      - name: Build the docs into site/dist/docs
        run: |
          set -euo pipefail
          cd docs
          npm install --no-audit --no-fund
          npm run build
          cd ..
          # Folded in rather than deployed separately: one project, one domain,
          # and the manual is part of the site instead of a link away from it.
          mkdir -p site/dist/docs
          cp -R docs/dist/* site/dist/docs/

      - name: Check something was actually produced
        working-directory: site
        # A build that succeeds and emits nothing would deploy an empty site over
        # a working one. Cheaper to catch here than to notice from a blank page.
        run: |
          test -f dist/index.html      || { echo "no dist/index.html"; exit 1; }
          test -f dist/docs/index.html || { echo "docs missing from dist/docs"; exit 1; }
          echo "$(find dist -name '*.html' | wc -l) page(s) built, docs included"

      - name: Create the Pages project if it does not exist
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        # `pages deploy` fails outright on a project that does not exist, so the
        # first deploy of a NEW site would always fail once and need somebody to
        # click Create in a dashboard -- the kind of step that gets forgotten and
        # then debugged as a broken pipeline.
        #
        # Attempt-and-tolerate rather than list-then-create: parsing `project
        # list` output meant depending on its formatting, and when the match
        # silently failed this tried to create a project that already existed and
        # turned a working deploy red. Only "already exists" is swallowed; every
        # other failure is printed and fatal.
        run: |
          set -o pipefail
          if out=$(npx --yes wrangler@latest pages project create ubuos-site \
                     --production-branch=main 2>&1); then
            echo "created ubuos-site"
          elif echo "$out" | grep -q "already exists"; then
            echo "ubuos-site already exists"
          else
            echo "$out"
            exit 1
          fi

      - name: Publish
        # Skipped rather than failed when the token is absent, so a fork's push
        # does not report a red build for a secret it was never going to have.
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        working-directory: site
        run: |
          npx --yes wrangler@latest pages deploy dist \
            --project-name=ubuos-site \
            --branch=main \
            --commit-dirty=true

      - name: Say what to do if it was skipped
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' }}
        run: |
          echo "Built the site but did not publish: CLOUDFLARE_API_TOKEN is not set."
          echo "Add these two repository secrets, then re-run:"
          echo "  CLOUDFLARE_API_TOKEN   — a token with Account → Cloudflare Pages → Edit"
          echo "  CLOUDFLARE_ACCOUNT_ID  — Cloudflare dashboard, right-hand sidebar"
