# Build the site and publish it to one Cloudflare Pages project.
#
# One domain, three parts of one site:
#
#   oss-cli site/  -> ubuos.com          the product page, folded in from the
#                                        other repository at build time
#   docs/          -> ubuos.com/docs     the manual
#   site/          -> ubuos.com/extensions  what plugs into it
#
# The root used to be a catalogue of tools, with the product page a level down at
# /osscli/. The catalogue listed exactly one tool, so the site had two full
# landing pages -- two headlines, two install lines -- and nothing to tell a
# visitor which was the front door. One product, one front door; /osscli/ 301s.
#
# docs used to be its own host and the landing page used to be its own Pages
# project. Both were folded in for the same reason: a second host is a second
# thing to remember, certificate, and find broken later.
#
# Deployed from here rather than by connecting Pages to Git, because a Pages Git
# integration reads its build settings from a dashboard -- so the command that
# builds this repository would live somewhere that is not this repository, and
# nobody reading the code could tell how it is published. Here it is reviewable,
# diffable, and changed in the same pull request as the thing it builds.
#
# The previous version of this workflow deployed the repository ROOT as a static
# site. That is why it had to be replaced rather than extended: the root is now
# source, not output, and publishing it would have served the Astro sources.
name: Deploy

on:
  push:
    branches: [main]
  # Polled, because the landing page folded in below lives in another repository
  # and a push from there would need a cross-repo credential. Same trade as
  # sync-release.yml: a few hours of staleness against a secret that cannot lapse.
  schedule:
    - cron: "41 */6 * * *"
  workflow_dispatch:

concurrency:
  group: deploy-ubuos
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Job level, so the publish guard can see it. A step's own `env:` is not in
    # scope for that step's `if:`, which read as undefined -- and undefined != ''
    # is TRUE, so publishing once ran with no token at all.
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22.12 is a hard floor, not a preference: package.json declares it and
          # Astro 7 will not run below it. Pinning here means a runner image
          # update cannot silently drop under the requirement.
          node-version: '22.12.0'

      - name: Install
        working-directory: site
        # `npm ci` needs a lockfile; `npm install` is used because the lockfiles
        # are gitignored here. Deterministic enough for a static site, and it
        # cannot fail on a lockfile that does not exist.
        run: npm install --no-audit --no-fund

      - name: Build
        working-directory: site
        run: npm run build

      - name: Build the docs into site/dist/docs
        run: |
          set -euo pipefail
          cd docs
          npm install --no-audit --no-fund
          npm run build
          cd ..
          # Folded in rather than deployed separately: one project, one domain,
          # and the manual is part of the site instead of a link away from it.
          mkdir -p site/dist/docs
          cp -R docs/dist/* site/dist/docs/

      # Same reasoning as the manual above: one project, one domain, and the
      # product page is part of the site rather than a separate host to remember.
      # Checked out rather than pushed from the other repository -- oss-cli is
      # public, so this needs no credential, and no credential is one that cannot
      # expire. The lesson from the Homebrew tap, which shipped two releases
      # pointing at the wrong jar because a cross-repo token had lapsed.
      - name: Fetch the oss-cli landing page
        uses: actions/checkout@v4
        with:
          repository: ramanathan1504/oss-cli
          ref: main
          path: .osscli

      # The ROOT, not /osscli/. There used to be a catalogue index here and the
      # product page one level down -- two full landing pages, each with its own
      # headline and install line, for a catalogue containing exactly one tool.
      # A visitor could not tell which was the real front door. One product, one
      # front door; /osscli/ redirects, so every link ever shared still lands.
      - name: Fold the product page in as the site root
        run: |
          set -euo pipefail
          # index.html only. _headers is honoured at the root of a Pages project
          # and nowhere else, so copying it into a subdirectory would look like a
          # policy that is silently not applied; README.md is source, not output.
          cp .osscli/site/index.html site/dist/index.html
          echo "root landing page ($(wc -c < site/dist/index.html) bytes)"

          # Nothing else may claim the root. If a page is ever added back at
          # site/src/pages/index.astro, Astro writes it here and this copy would
          # silently overwrite it -- or, with the steps reordered, be overwritten
          # by it. Either way the site would have a front door nobody chose.
          if [ -f site/src/pages/index.astro ]; then
            echo "error: site/src/pages/index.astro exists and would fight the folded root." >&2
            echo "       Decide which is the front door before shipping both." >&2
            exit 1
          fi

          # The old URL keeps working. Cloudflare Pages reads _redirects from the
          # output root; 301 because this is a decision, not an experiment.
          printf '/osscli/*  /  301\n/osscli   /  301\n' >> site/dist/_redirects
          echo "redirect written:"; cat site/dist/_redirects

      # Hosts this project has retired. Linking to one is a dead link that answers
      # nothing -- and it is easy to leave behind, because the page that links to it
      # keeps building perfectly. ubuos.com's own catalogue pointed at
      # osscli.pages.dev for hours after that project was deleted.
      #
      # Deterministic and offline: it does not ask whether a URL resolves, it asks
      # whether we are still naming somewhere we chose to switch off.
      - name: Refuse to publish links to retired hosts
        run: |
          set -euo pipefail
          retired="osscli.pages.dev docs.ubuos.com ubuos-docs.pages.dev"
          found=0
          for host in $retired; do
            if grep -rl --include='*.html' --include='*.json' --include='*.xml' "$host" site/dist >/dev/null 2>&1; then
              echo "::error::the built site links to $host, which is retired"
              grep -rl --include='*.html' "$host" site/dist | sed 's/^/    /'
              found=1
            fi
          done
          [ "$found" -eq 0 ] || exit 1
          echo "no links to retired hosts"

      - name: Check something was actually produced
        working-directory: site
        # A build that succeeds and emits nothing would deploy an empty site over
        # a working one. Cheaper to catch here than to notice from a blank page.
        run: |
          test -f dist/index.html      || { echo "no dist/index.html"; exit 1; }
          test -f dist/docs/index.html || { echo "docs missing from dist/docs"; exit 1; }
          grep -q 'cmd-board' dist/index.html || { echo "dist/index.html is not the product page"; exit 1; }
          grep -q '^/osscli' dist/_redirects || { echo "no /osscli redirect: shared links would 404"; exit 1; }
          echo "$(find dist -name '*.html' | wc -l) page(s) built, docs included"

      - name: Create the Pages project if it does not exist
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        # `pages deploy` fails outright on a project that does not exist, so the
        # first deploy of a NEW site would always fail once and need somebody to
        # click Create in a dashboard -- the kind of step that gets forgotten and
        # then debugged as a broken pipeline.
        #
        # Attempt-and-tolerate rather than list-then-create: parsing `project
        # list` output meant depending on its formatting, and when the match
        # silently failed this tried to create a project that already existed and
        # turned a working deploy red. Only "already exists" is swallowed; every
        # other failure is printed and fatal.
        run: |
          set -o pipefail
          if out=$(npx --yes wrangler@latest pages project create ubuos-site \
                     --production-branch=main 2>&1); then
            echo "created ubuos-site"
          elif echo "$out" | grep -q "already exists"; then
            echo "ubuos-site already exists"
          else
            echo "$out"
            exit 1
          fi

      - name: Publish
        # Skipped rather than failed when the token is absent, so a fork's push
        # does not report a red build for a secret it was never going to have.
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        working-directory: site
        run: |
          npx --yes wrangler@latest pages deploy dist \
            --project-name=ubuos-site \
            --branch=main \
            --commit-dirty=true

      - name: Say what to do if it was skipped
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' }}
        run: |
          echo "Built the site but did not publish: CLOUDFLARE_API_TOKEN is not set."
          echo "Add these two repository secrets, then re-run:"
          echo "  CLOUDFLARE_API_TOKEN   — a token with Account → Cloudflare Pages → Edit"
          echo "  CLOUDFLARE_ACCOUNT_ID  — Cloudflare dashboard, right-hand sidebar"
